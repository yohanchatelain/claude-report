[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "claude-report"
dynamic = ["version"]
description = "List and follow the background tasks (builds, test runs) of Claude Code conversations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yohan Chatelain", email = "yohan.chatelain@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["claude", "claude-code", "cli", "tail", "logs"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/yohanchatelain/claude-report"
Issues = "https://github.com/yohanchatelain/claude-report/issues"

[project.scripts]
claude-report = "claude_report.cli:main_entry"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
path = "src/claude_report/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["claude_report"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PL", "D"]
ignore = [
    "D105", "D107", "D203", "D213",   # docstring layout choices
    "PLR0913", "PLR2004",             # many keyword args / magic numbers in tests and CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0915"]

[tool.mypy]
strict = true
files = ["src", "tests"]
